<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emsland Quiz</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 50px auto;
    text-align: center;
    background: #f4f4f4;
}

#quiz-container {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

button {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 15px;
    cursor: pointer;
    border: none;
    background: #0078D4;
    color: white;
    border-radius: 5px;
    font-size: 16px;
}

button:hover {
    background: #005ea2;
}

#result {
    font-size: 24px;
    margin-top: 20px;
    font-weight: bold;
}
</style>
</head>
<body>

<div id="quiz-container">
    <h1>Emsland Quiz</h1>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <div id="result"></div>
</div>

<script>
const quiz = [
{
    question: "Welche Stadt ist die größte im Emsland?",
    answers: ["Lingen", "Meppen", "Papenburg", "Haselünne"],
    correct: 0
},
{
    question: "Welcher Fluss gab dem Emsland seinen Namen?",
    answers: ["Hase", "Ems", "Weser", "Elbe"],
    correct: 1
},
{
    question: "Für welche Werft ist Papenburg bekannt?",
    answers: ["Meyer Werft", "Blohm+Voss", "Lürssen", "HDW"],
    correct: 0
},
{
    question: "Welche Farbe hat das Wappen des Landkreises Emsland hauptsächlich?",
    answers: ["Blau", "Rot", "Grün", "Gelb"],
    correct: 0
},
{
    question: "In welcher Stadt befindet sich die Hochschule Osnabrück Campus Lingen?",
    answers: ["Meppen", "Papenburg", "Lingen", "Sögel"],
    correct: 2
}
];

let currentQuestion = 0;
let score = 0;

function showQuestion() {
    const q = quiz[currentQuestion];

    document.getElementById("question").innerText = q.question;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const btn = document.createElement("button");
        btn.innerText = answer;

        btn.onclick = () => {
            if(index === q.correct){
                score++;
            }

            currentQuestion++;

            if(currentQuestion < quiz.length){
                showQuestion();
            } else {
                showResult();
            }
        };

        answersDiv.appendChild(btn);
    });
}

function showResult(){
    document.getElementById("question").innerText = "Quiz beendet!";
    document.getElementById("answers").innerHTML = "";

    document.getElementById("result").innerHTML =
        `Du hast ${score} von ${quiz.length} Fragen richtig beantwortet.`;
}

showQuestion();
</script>

</body>
</html>
